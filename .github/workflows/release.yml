name: Build and Release

on:
  push:
    branches:
      - '260419-feat-tauri-go-reimplementation'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Build Windows
        run: go build -ldflags="-s -w -X main.Version=0.3.0" -o codux.exe .
        
      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: codux-windows-amd64.exe
          path: codux.exe
          retention-days: 30
